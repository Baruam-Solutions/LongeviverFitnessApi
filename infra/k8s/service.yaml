apiVersion: v1
kind: Service
metadata:
  name: longeviver-gke
  namespace: ${K8S_NAMESPACE}
  annotations:
    cloud.google.com/load-balancer-type: "External"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: longeviver-gke
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
